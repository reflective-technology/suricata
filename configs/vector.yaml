# Vector sidecar for the Suricata sensor: ships EVE to Kafka without parsing
# HTTP events (design (b), reflective-technology/http-collector-poc).
# Environment: KAFKA_SERVER, SENSOR_ID, SENSOR_IP, PROJECT_ID, RULESET_VERSION
# (empty RULESET_VERSION = no request-body ruleset on this sensor).
#   http   -> regex mask on the raw line -> syslog-ng-shaped envelope -> Kafka lgshlgs (tag pcap_eve)
#   alert  -> parsed (alerts are rare) -> Kafka pcap-body-signal-v1
#   flow   -> HTTP and HTTP/2 connections only, parsed -> Kafka pcap-body-signal-v1 (type "flow";
#             connection-level signals, joined downstream on flow_id)
#   frontier: per 5 s window, the maximum EVE timestamp over every event that passed
#             (http, alert, flow and Suricata stats, so idle sensors still advance); emitted
#             when the window closes, after that window's alerts and flows entered the same sink
data_dir: /var/lib/vector
acknowledgements:
  enabled: true

sources:
  eve_files:
    type: file
    include: ["/var/log/suricata/eve-*.json", "/var/log/suricata/stats-*.json"]
    # Suricata rotates hourly; delete a file one hour after it was read to the end
    # (events already read sit in the disk buffers below)
    remove_after_secs: 3600
    read_from: beginning
    fingerprint:
      strategy: checksum
    max_line_bytes: 4194304
  vector_metrics:
    type: internal_metrics
    scrape_interval_secs: 2

transforms:
  route:
    type: route
    inputs: [eve_files]
    route:
      http: 'contains(string!(.message), "\"event_type\":\"http\"")'
      alert: 'contains(string!(.message), "\"event_type\":\"alert\"")'
      stats: 'contains(string!(.message), "\"event_type\":\"stats\"")'
      flow: 'contains(string!(.message), "\"event_type\":\"flow\"")'

  http_envelope:
    type: remap
    inputs: [route.http]
    source: |
      m = string!(.message)
      m = replace(m, r'(?i)([?&](token|access_token|api_key|apikey|sig|signature|password)=)[^&"\\]*', "$${1}[REDACTED]")
      # Every header is logged (dump-all-headers), so mask any header whose name looks like a
      # credential. The value keeps its decoded length as "[REDACTED:<n>]" so header byte sizes
      # (bytes_in / bytes_out) can still be computed downstream; presence stays testable.
      m = replace_with(m, r'(?i)("name":"[^"]*(?:cookie|authorization|token|secret|api[-_]?key|session|passw|signature|jwt|credential)[^"]*","value":")((?:[^"\\]|\\.)*)"') -> |h| {
        v = string!(h.captures[1])
        n = strlen(string(parse_json("\"" + v + "\"") ?? v) ?? v)
        string!(h.captures[0]) + "[REDACTED:" + to_string(n) + "]\""
      }
      . = {
        "message": m,
        "tags": ["pcap_eve"],
        "raw_host_name": get_env_var("SENSOR_ID") ?? "suricata",
        "raw_host_ip": get_env_var("SENSOR_IP") ?? "",
        "raw_body_ruleset_version": get_env_var("RULESET_VERSION") ?? "",
        "raw_sensor_id": get_env_var("SENSOR_ID") ?? "suricata"
      }

  body_signal:
    type: remap
    inputs: [route.alert]
    source: |
      e = parse_json!(string!(.message))
      # EVE "2026-10-17T01:57:40.159657+0000" -> RFC 3339 UTC with microseconds
      t = parse_timestamp(string(e.timestamp) ?? "", "%Y-%m-%dT%H:%M:%S%.6f%z") ?? now()
      . = {
        "type": "alert",
        "project_id": get_env_var("PROJECT_ID") ?? "",
        "sensor_id": get_env_var("SENSOR_ID") ?? "suricata",
        "flow_id": e.flow_id,
        "tx_id": e.tx_id,
        "h2_stream_id": to_int(e.http.http2.stream_id) ?? 0,
        "sid": e.alert.signature_id,
        "ruleset_version": get_env_var("RULESET_VERSION") ?? "",
        "ts": format_timestamp!(t, "%Y-%m-%dT%H:%M:%S%.6fZ", timezone: "UTC")
      }

  # One record per connection, written by Suricata when the flow times out (about 60 s after
  # the last packet; ~600 s for an idle keep-alive connection). Same sink and key as the alerts
  # and the frontier, so a frontier past T means every flow logged up to T was delivered first.
  # reason "timeout" / "tcp_reuse" = connection ended; "shutdown" / "forced" = cut short, so the
  # byte and time totals are partial.
  flow_signal:
    type: remap
    inputs: [route.flow]
    # a record without its required fields is dropped (counted as discarded), never sent half-filled
    drop_on_error: true
    source: |
      e = parse_json!(string!(.message))
      ap = string(e.app_proto) ?? ""
      if ap != "http" && ap != "http2" { abort }
      f = object!(e.flow)
      fmt = "%Y-%m-%dT%H:%M:%S%.6f%z"
      out = "%Y-%m-%dT%H:%M:%S%.6fZ"
      . = {
        "type": "flow",
        "project_id": get_env_var("PROJECT_ID") ?? "",
        "sensor_id": get_env_var("SENSOR_ID") ?? "suricata",
        "flow_id": to_int!(e.flow_id),
        "app_proto": ap,
        "start": format_timestamp!(parse_timestamp!(string!(f.start), fmt), out, timezone: "UTC"),
        "end": format_timestamp!(parse_timestamp!(string!(f.end), fmt), out, timezone: "UTC"),
        "age": to_int(f.age) ?? 0,
        "pkts_toserver": to_int(f.pkts_toserver) ?? 0,
        "pkts_toclient": to_int(f.pkts_toclient) ?? 0,
        "bytes_toserver": to_int(f.bytes_toserver) ?? 0,
        "bytes_toclient": to_int(f.bytes_toclient) ?? 0,
        "state": string(f.state) ?? "",
        "reason": string(f.reason) ?? "",
        "tx_cnt": to_int(f.tx_cnt) ?? 0,
        "alerted": f.alerted == true,
        "src_ip": e.src_ip,
        "src_port": e.src_port,
        "dest_ip": e.dest_ip,
        "dest_port": e.dest_port,
        "ts": format_timestamp!(parse_timestamp!(string!(e.timestamp), fmt), out, timezone: "UTC")
      }
      # TCP only: Suricata sets tcp.rst when it saw a reset; absent tcp object = no field
      if is_object(e.tcp) { .tcp_rst = e.tcp.rst == true }
      . = compact(., null: true, string: false, object: false, array: false, nullish: false)

  frontier_ts:
    type: remap
    inputs: [route.http, route.alert, route.flow, route.stats]
    # an event without a parseable timestamp must not move the frontier: drop it
    drop_on_error: true
    source: |
      m = parse_regex!(string!(.message), r'"timestamp":"(?P<ts>[^"]+)"')
      t = parse_timestamp!(m.ts, "%Y-%m-%dT%H:%M:%S%.6f%z")
      . = {"k": "frontier", "ts_us": to_unix_timestamp(t, unit: "microseconds")}

  frontier_window:
    type: reduce
    inputs: [frontier_ts]
    group_by: [k]
    expire_after_ms: 5000
    end_every_period_ms: 5000
    merge_strategies:
      ts_us: max

  frontier:
    type: remap
    inputs: [frontier_window]
    source: |
      t = from_unix_timestamp!(to_int!(.ts_us), unit: "microseconds")
      . = {"type": "frontier", "project_id": get_env_var("PROJECT_ID") ?? "", "sensor_id": get_env_var("SENSOR_ID") ?? "suricata",
           "eve_ts_max": format_timestamp!(t, "%Y-%m-%dT%H:%M:%S%.6fZ", timezone: "UTC")}

sinks:
  kafka_lgshlgs:
    type: kafka
    inputs: [http_envelope]
    bootstrap_servers: "${KAFKA_SERVER}"
    topic: lgshlgs
    encoding:
      codec: json
    message_timeout_ms: 300000
    buffer:
      type: disk
      max_size: 2147483648
      when_full: block
    acknowledgements:
      enabled: true

  kafka_body_signal:
    type: kafka
    inputs: [body_signal, flow_signal, frontier]
    bootstrap_servers: "${KAFKA_SERVER}"
    topic: pcap-body-signal-v1
    key_field: sensor_id
    encoding:
      codec: json
    message_timeout_ms: 300000
    buffer:
      type: disk
      max_size: 536870912
      when_full: block
    acknowledgements:
      enabled: true

  metrics:
    type: prometheus_exporter
    inputs: [vector_metrics]
    address: 0.0.0.0:9598

tests:
  - name: http envelope masks secrets and keeps header presence
    inputs:
      - insert_at: http_envelope
        type: log
        log_fields:
          message: '{"event_type":"http","http":{"url":"\/a?token=SECRETCANARY-1&x=1","request_headers":[{"name":"Cookie","value":"sid=SECRETCANARY-2"},{"name":"Proxy-Authorization","value":"Basic SECRETCANARY-3"},{"name":"X-Api-Key","value":"SECRETCANARY-4"},{"name":"X-CSRF-Token","value":"a\"SECRETCANARY-5"},{"name":"Accept","value":"*\/*"}],"response_headers":[{"name":"Set-Cookie","value":"s=SECRETCANARY-6; Path=\/"},{"name":"Server","value":"nginx"}]}}'
    outputs:
      - extract_from: http_envelope
        conditions:
          - type: vrl
            source: |
              m = string!(.message)
              assert!(!contains(m, "SECRETCANARY"))
              # masked values keep their decoded length; other headers are untouched
              assert!(contains(m, "{\"name\":\"Cookie\",\"value\":\"[REDACTED:18]\"}"))
              assert!(contains(m, "{\"name\":\"Proxy-Authorization\",\"value\":\"[REDACTED:20]\"}"))
              assert!(contains(m, "{\"name\":\"X-Api-Key\",\"value\":\"[REDACTED:14]\"}"))
              assert!(contains(m, "{\"name\":\"X-CSRF-Token\",\"value\":\"[REDACTED:16]\"}"))
              assert!(contains(m, "{\"name\":\"Set-Cookie\",\"value\":\"[REDACTED:24]\"}"))
              assert!(contains(m, "{\"name\":\"Accept\",\"value\":\"*\\/*\"}"))
              assert!(contains(m, "{\"name\":\"Server\",\"value\":\"nginx\"}"))
              assert!(is_object(parse_json!(m)))
              assert_eq!(.tags, ["pcap_eve"])
  - name: alert becomes a body signal
    inputs:
      - insert_at: body_signal
        type: log
        log_fields:
          message: '{"timestamp":"2026-10-17T01:57:40.159657+0000","event_type":"alert","flow_id":42,"tx_id":3,"alert":{"signature_id":9100001}}'
    outputs:
      - extract_from: body_signal
        conditions:
          - type: vrl
            source: |
              assert_eq!(.flow_id, 42)
              assert_eq!(.tx_id, 3)
              assert_eq!(.sid, 9100001)
              assert_eq!(.h2_stream_id, 0)
              assert_eq!(.ts, "2026-10-17T01:57:40.159657Z")
  - name: http flow becomes a flow signal
    inputs:
      - insert_at: flow_signal
        type: log
        log_fields:
          message: '{"timestamp":"2026-10-19T00:01:05.364296+0000","flow_id":779302414004608,"event_type":"flow","src_ip":"10.0.0.1","src_port":51682,"dest_ip":"10.0.0.2","dest_port":3000,"proto":"TCP","app_proto":"http","flow":{"pkts_toserver":7,"pkts_toclient":5,"bytes_toserver":698,"bytes_toclient":10198,"start":"2026-10-19T00:00:02.246981+0000","end":"2026-10-19T00:00:02.257031+0000","age":0,"state":"closed","reason":"timeout","alerted":false,"tx_cnt":1},"tcp":{"tcp_flags":"1b","syn":true,"fin":true,"state":"closed"}}'
    outputs:
      - extract_from: flow_signal
        conditions:
          - type: vrl
            source: |
              assert_eq!(.type, "flow")
              assert_eq!(.flow_id, 779302414004608)
              assert!(is_integer(.flow_id))
              assert_eq!(.start, "2026-10-19T00:00:02.246981Z")
              assert_eq!(.end, "2026-10-19T00:00:02.257031Z")
              assert_eq!(.ts, "2026-10-19T00:01:05.364296Z")
              assert_eq!(.bytes_toclient, 10198)
              assert_eq!(.pkts_toserver, 7)
              assert_eq!(.tx_cnt, 1)
              assert_eq!(.reason, "timeout")
              assert_eq!(.alerted, false)
              assert_eq!(.tcp_rst, false)
              assert_eq!(.dest_port, 3000)
  - name: http2 flow cut short by shutdown keeps reason and reset
    inputs:
      - insert_at: flow_signal
        type: log
        log_fields:
          message: '{"timestamp":"2026-10-19T00:05:00.000001+0000","flow_id":7,"event_type":"flow","src_ip":"10.0.0.1","src_port":1,"dest_ip":"10.0.0.2","dest_port":80,"app_proto":"http2","flow":{"pkts_toserver":1,"pkts_toclient":1,"bytes_toserver":1,"bytes_toclient":1,"start":"2026-10-19T00:00:00.000000+0000","end":"2026-10-19T00:04:59.000000+0000","age":299,"state":"established","reason":"shutdown","alerted":true,"tx_cnt":4},"tcp":{"rst":true}}'
    outputs:
      - extract_from: flow_signal
        conditions:
          - type: vrl
            source: |
              assert_eq!(.app_proto, "http2")
              assert_eq!(.reason, "shutdown")
              assert_eq!(.age, 299)
              assert_eq!(.alerted, true)
              assert_eq!(.tcp_rst, true)
  - name: non-http flows and flows without start are not sent
    no_outputs_from: [flow_signal]
    inputs:
      - insert_at: flow_signal
        type: log
        log_fields:
          message: '{"timestamp":"2026-10-19T00:01:05.364296+0000","flow_id":1,"event_type":"flow","proto":"UDP","app_proto":"failed","flow":{"start":"2026-10-19T00:00:02.246981+0000","end":"2026-10-19T00:00:02.257031+0000"}}'
      - insert_at: flow_signal
        type: log
        log_fields:
          message: '{"timestamp":"2026-10-19T00:01:05.364296+0000","flow_id":2,"event_type":"flow","app_proto":"http","flow":{"end":"2026-10-19T00:00:02.257031+0000"}}'
  - name: frontier timestamp in microseconds
    inputs:
      - insert_at: frontier_ts
        type: log
        log_fields:
          message: '{"timestamp":"2026-10-17T01:57:40.159657+0000","event_type":"stats"}'
    outputs:
      - extract_from: frontier_ts
        conditions:
          - type: vrl
            source: |
              assert_eq!(.ts_us, 1792202260159657)
              assert_eq!(.k, "frontier")
